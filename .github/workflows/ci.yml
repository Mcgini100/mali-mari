name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Parser fixtures (JavaScript reference)
        run: node tool/test_parser.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: SQLite for database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Generate Android scaffolding, packages and Drift code
        run: ./tool/setup.sh android

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Show analyzer issues as annotations
        if: failure()
        run: |
          flutter analyze --no-fatal-infos --format=machine 2>&1 \
            | awk -F'|' -v ws="$GITHUB_WORKSPACE/" 'NF>=8 { f=$4; sub(ws, "", f); printf "::%s file=%s,line=%s,col=%s::%s [%s]\n", ($1=="ERROR" ? "error" : "warning"), f, $5, $6, $8, $3 }' || true

      - name: Test
        run: flutter test

      - name: Show test failures as annotations
        if: failure()
        run: flutter test --reporter github || true

      # test/screens_test.dart walks the app on sample data and saves each
      # screen, so a UI change can be looked at without installing a build.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mari-screens
          path: build/screens/*.png
          if-no-files-found: ignore

      - name: SCRATCH dump screens
        if: always()
        run: |
          python3 -m pip install -q pillow
          for f in build/screens/*.png; do
            echo "@@IMG $(basename $f .png)"
            python3 -c "import sys;from PIL import Image;Image.open(sys.argv[1]).convert('RGB').save('/tmp/o.jpg',quality=80)" "$f"
            base64 -w 4000 /tmp/o.jpg
            echo "@@END"
          done
