name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parser fixtures (JavaScript reference)
        run: node tool/test_parser.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: SQLite for database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Generate Android scaffolding, packages and Drift code
        run: ./tool/setup.sh android

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: mari-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
